<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pastillero inteligente · Configurar compartimento</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main class="app">
    <section class="contenido">
      <h1><a href="panel.html" style="color:inherit;text-decoration:none">←</a> <span id="titulo">Compartimento</span></h1>

      <form id="form">
        <label for="medicamento">Medicamento</label>
        <input type="text" id="medicamento" placeholder="Ej. Metformina" maxlength="60">

        <label for="dosis">Dosis</label>
        <input type="text" id="dosis" placeholder="Ej. 1 tableta de 850 mg" maxlength="60">

        <label>Repetir cada</label>
        <div class="segmentos">
          <input type="radio" name="cada" id="c4" value="4"><label for="c4">4 h</label>
          <input type="radio" name="cada" id="c6" value="6"><label for="c6">6 h</label>
          <input type="radio" name="cada" id="c8" value="8" checked><label for="c8">8 h</label>
          <input type="radio" name="cada" id="c12" value="12"><label for="c12">12 h</label>
          <input type="radio" name="cada" id="c24" value="24"><label for="c24">24 h</label>
          <input type="radio" name="cada" id="cp" value="p"><label for="cp" class="opcion-ancha">Horario personalizado</label>
        </div>

        <!-- Cada X horas: solo se pide la primera toma -->
        <div id="bloque-intervalo">
          <label for="hora">Hora de la primera toma</label>
          <input type="time" id="hora" class="corto" value="08:00">
        </div>

        <!-- Personalizado: el encargado elige cada hora (hasta 6) -->
        <div id="bloque-personalizado" class="oculto">
          <label>Horas de las tomas</label>
          <div id="lista-horas" class="lista-horas"></div>
          <button type="button" class="boton chico" id="btn-agregar-hora">+ Agregar hora</button>
        </div>

        <div class="fila-switch">
          <span>Activo</span>
          <label class="switch" style="margin:0"><input type="checkbox" id="activo" checked><span></span></label>
        </div>

        <p class="suave" id="vista-previa"></p>

        <div class="botones">
          <button type="button" class="boton" id="btn-probar">Probar LED</button>
          <button type="submit" class="boton principal" id="btn-guardar">Guardar</button>
        </div>
        <p class="mensaje" id="mensaje"></p>
        <p class="suave centro">Guardar envía el horario al pastillero</p>
      </form>
    </section>

    <nav class="nav">
      <a href="panel.html" class="actual">Panel</a>
      <a href="historial.html">Historial</a>
    </nav>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="js/config.js"></script>
  <script src="js/common.js"></script>
  <script src="js/configurar.js"></script>
</body>
</html>
